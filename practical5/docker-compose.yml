
services:
  minio1:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    hostname: minio1
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_DISTRIBUTED_MODE_ENABLED: "yes"
      MINIO_DISTRIBUTED_NODES: "minio{1...4}/bitnami/minio/data"
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
      MINIO_DATA_DIR: /bitnami/minio/data
    volumes:
      - ./data/minio1:/bitnami/minio/data
    networks:
      - minio-net

  minio2:
